# AI小说安卓App - CI/CD门禁
# 在PR创建/更新时触发，执行lint、测试和AI代码审查
#
# 门禁检查项：
# 1. 构建测试 - 验证代码能否编译
# 2. Lint检查 - 代码规范与安全（reviewdog自动评论）
# 3. 单元测试 - 业务逻辑验证
# 4. 安全检查 - 硬编码密钥检测
# 5. AI代码审查 - GLM Code Plan智能分析
#
# @see AGENTS.md 9.4 GitHub Actions门禁规范

name: Android CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 并发控制：同一PR/分支只保留最新的workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ==================== 构建测试 ====================
  build:
    name: 构建测试
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: 设置Gradle缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 授予执行权限
        run: chmod +x gradlew

      - name: 构建Debug包
        run: ./gradlew assembleDebug --stacktrace

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ==================== Lint检查（带reviewdog） ====================
  lint:
    name: Lint检查
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: 设置Gradle缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 授予执行权限
        run: chmod +x gradlew

      - name: 运行Lint
        run: ./gradlew lint --stacktrace

      - name: 运行Lint（reviewdog报告）
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-android-lint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added
          fail_on_error: true
          level: warning

      - name: 上传Lint报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html
          retention-days: 14

  # ==================== 单元测试（带reviewdog） ====================
  unit-test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: 设置Gradle缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 授予执行权限
        run: chmod +x gradlew

      - name: 运行单元测试
        run: ./gradlew test --stacktrace

      - name: 发布测试报告（reviewdog）
        if: github.event_name == 'pull_request' && always()
        uses: reviewdog/action-junit-report@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added
          junit_files: app/build/test-results/testDebugUnitTest/*.xml

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14

  # ==================== 安全检查 ====================
  security:
    name: 安全检查
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Trivy漏洞扫描
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: 检查硬编码密钥
        run: |
          echo "检查硬编码API密钥..."
          # 排除测试文件（测试文件中的密钥是用于测试安全检测功能的假数据）
          if grep -rE "(api[_-]?key|apikey|secret|password|token)\s*[=:]\s*['\"][^'\"]{10,}['\"]" \
            --include="*.kt" --include="*.java" --include="*.xml" \
            --exclude-dir=".gradle" --exclude-dir="build" --exclude-dir="test" --exclude-dir="androidTest" .; then
            echo "::error::发现硬编码的密钥，请使用环境变量或加密存储"
            exit 1
          fi
          echo "::notice::未发现硬编码密钥"

      - name: 检查敏感文件
        run: |
          echo "检查敏感文件..."
          SENSITIVE_FILES=(
            ".env"
            "*.pem"
            "*.key"
            "secrets.properties"
            "local.properties"
            "google-services.json"
          )

          for file in "${SENSITIVE_FILES[@]}"; do
            if ls $file 2>/dev/null | grep -q .; then
              echo "::error::发现敏感文件: $file，请添加到.gitignore"
              exit 1
            fi
          done
          echo "::notice::未发现敏感文件"

  # ==================== AI代码审查（GLM Code Plan） ====================
  ai-review:
    name: AI代码审查
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取PR变更
        id: changes
        run: |
          # 获取变更的文件列表
          FILES=$(git diff --name-only origin/main...HEAD | head -20)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # 获取代码差异
          DIFF=$(git diff origin/main...HEAD | head -3000)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: GLM代码审查
        if: env.GLM_API_KEY != ''
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: |
          echo "正在使用GLM Code Plan进行代码审查..."

          # 构建审查请求
          REVIEW_PROMPT="你是一个专业的代码审查专家。请审查以下代码变更，重点关注：
          1. 代码质量和可读性
          2. 潜在的Bug和逻辑错误
          3. 性能问题
          4. 安全隐患
          5. 最佳实践建议

          变更的文件：
          ${{ steps.changes.outputs.files }}

          代码差异：
          \`\`\`diff
          ${{ steps.changes.outputs.diff }}
          \`\`\`

          请用中文给出简洁的审查意见，格式为：
          ### 🤖 AI代码审查报告
          - ✅ 优点：...
          - ⚠️ 建议：...
          - 🐛 潜在问题：...
          "

          # 调用GLM API
          RESPONSE=$(curl -s -X POST \
            "https://open.bigmodel.cn/api/coding/paas/v4/chat/completions" \
            -H "Authorization: Bearer $GLM_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"GLM-4.6\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"你是专业的代码审查专家\"},
                {\"role\": \"user\", \"content\": $(echo "$REVIEW_PROMPT" | jq -Rs .)}
              ],
              \"max_tokens\": 2000,
              \"temperature\": 0.3
            }")

          # 提取审查结果
          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "审查失败"')

          # 保存结果
          echo "review<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "AI审查完成"

      - name: 发布AI审查评论
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REVIEW_RESULT: ${{ steps.ai-review.outputs.review }}
        with:
          script: |
            const reviewResult = process.env.REVIEW_RESULT || `
            ### 🤖 AI代码审查

            ⚠️ **GLM API Key未配置**

            如需启用AI代码审查，请在仓库设置中添加Secret：
            - 名称：\`GLM_API_KEY\`
            - 值：您的GLM Code Plan API密钥

            获取API密钥：https://open.bigmodel.cn
            `;

            // 查找并更新现有评论，或创建新评论
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🤖 AI代码审查')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: reviewResult
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: reviewResult
              });
            }

  # ==================== 门禁结果汇总 ====================
  gate-result:
    name: 门禁结果
    runs-on: ubuntu-latest
    needs: [build, lint, unit-test, security]
    if: always()

    steps:
      - name: 检查门禁结果
        run: |
          echo "============================================"
          echo "  GitHub Actions 门禁结果"
          echo "============================================"
          echo ""

          BUILD_RESULT="${{ needs.build.result }}"
          LINT_RESULT="${{ needs.lint.result }}"
          TEST_RESULT="${{ needs.unit-test.result }}"
          SECURITY_RESULT="${{ needs.security.result }}"

          echo "| 检查项 | 状态 |"
          echo "|-------|------|"
          echo "| 构建 | $BUILD_RESULT |"
          echo "| Lint | $LINT_RESULT |"
          echo "| 单元测试 | $TEST_RESULT |"
          echo "| 安全检查 | $SECURITY_RESULT |"
          echo ""

          if [[ "$BUILD_RESULT" == "success" && \
                "$LINT_RESULT" == "success" && \
                "$TEST_RESULT" == "success" && \
                "$SECURITY_RESULT" == "success" ]]; then
            echo "✅ 所有门禁检查通过！"
            exit 0
          else
            echo "❌ 门禁检查未通过，请修复上述问题"
            exit 1
          fi

      - name: PR门禁状态评论
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildResult = '${{ needs.build.result }}';
            const lintResult = '${{ needs.lint.result }}';
            const testResult = '${{ needs.unit-test.result }}';
            const securityResult = '${{ needs.security.result }}';

            const statusEmoji = (status) => status === 'success' ? '✅' : '❌';

            const body = `## 🔒 门禁检查结果

            | 检查项 | 状态 |
            |-------|------|
            | 构建 | ${statusEmoji(buildResult)} ${buildResult} |
            | Lint | ${statusEmoji(lintResult)} ${lintResult} |
            | 单元测试 | ${statusEmoji(testResult)} ${testResult} |
            | 安全检查 | ${statusEmoji(securityResult)} ${securityResult} |

            ${buildResult === 'success' && lintResult === 'success' && testResult === 'success' && securityResult === 'success'
              ? '### ✅ 所有检查通过，可以合入\n\n> 点击 **Squash and merge** 合并此PR'
              : '### ❌ 存在未通过的检查，请修复后重新提交'}
            `;

            // 查找并更新现有评论
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🔒 门禁检查结果')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
